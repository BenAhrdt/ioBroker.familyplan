<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../../socket.io/socket.io.js"></script>
<style>:root{font-family:system-ui,sans-serif;color:#182033;background:#f4f6fa}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:16px}.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.head img{width:46px}.head h1{margin:0;flex:1}.btn{border:0;border-radius:8px;background:#4f6bed;color:#fff;padding:11px 16px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0}.card,.filters,.table{background:#fff;border-radius:12px;box-shadow:0 2px 9px #17213b12;padding:14px}.label{font-size:12px;color:#667085}.value{font-size:18px;margin-top:5px;overflow-wrap:anywhere}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:12px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccd2df;border-radius:7px;background:white}.table{overflow:auto;padding:0}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f5;font-size:14px}th{position:sticky;top:0;background:#f8f9fc}.pill{padding:3px 7px;border-radius:10px;background:#e8edff}.ok{color:#14804a}.bad{color:#c4320a}.empty{text-align:center;padding:38px;color:#667085}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}.wrap{padding:10px}}</style></head>
<body><main class="wrap"><div class="head"><img src="familienplan.svg" alt=""><h1>FamilienPlan</h1><button class="btn" id="refresh">Jetzt aktualisieren</button></div><section class="cards" id="cards"></section>
<section class="filters"><input id="search" placeholder="Termine durchsuchen"><select id="eventType"><option value="">Alle Terminarten</option></select><select id="custom"><option value="">Alle eigenen Typen</option></select><select id="child"><option value="">Alle Kinder</option></select><select id="range"><option value="all">Gesamter Zeitraum</option><option value="today">Heute</option><option value="future" selected>Ab heute</option></select></section>
<section class="table"><table><thead><tr><th>Titel</th><th>Terminart</th><th>Eigener Typ</th><th>Kind</th><th>Beginn</th><th>Ende</th><th>Ganztägig</th><th>Trigger</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>Keine passenden Termine</div></section></main>
<script>(()=>{const socket=io.connect(),params=new URLSearchParams(location.search),rawInstance=params.get('instance')||params.get('id')||([...params.keys()].find(key=>/^(?:familyplan\.)?\d+$/.test(key))??'0');let instance=/^familyplan\.\d+$/.test(rawInstance)?rawInstance:`familyplan.${/^\d+$/.test(rawInstance)?rawInstance:'0'}`,events=[],children={},triggers=[];const $=id=>document.getElementById(id);const get=(id)=>new Promise(resolve=>socket.emit('getState',instance+'.'+id,(e,s)=>resolve(s?.val)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>s?new Intl.DateTimeFormat(document.documentElement.lang||'de-DE',{dateStyle:'short',timeStyle:'short'}).format(new Date(s)):'—';const labels={stay:'Aufenthalt / Betreuung',birthday:'Geburtstag',school_holiday:'Schulferien',general:'Allgemein',other:'Sonstige',cleaning:'Reinigung',waste:'Abfall',school:'Schule',private:'Privat'};const label=v=>labels[String(v??'').trim().toLowerCase()]||String(v??'');
async function load(){const vals=await Promise.all(['info.connection','info.lastSuccessfulSync','info.nextSync','info.queryRange','info.eventCount','calendar.current.count','info.scheduledTriggerCount','info.apiVersion','calendar.displayJson','triggers.schedule'].map(get));const [connected,last,next,range,count,activeCount,tc,version,json,schedule]=vals;try{events=JSON.parse(json||'[]')}catch{events=[]}try{triggers=JSON.parse(schedule||'[]')}catch{triggers=[]}children={};events.forEach(event=>{if(event.child_id!=null&&event.child_name)children[event.child_id]=event.child_name});renderFilters();render();let query={};try{query=JSON.parse(range||'{}')}catch{};$('cards').innerHTML=[['Verbindung',connected?'<span class="ok">● Verbunden</span>':'<span class="bad">● Getrennt</span>'],['Letzter Abruf',fmt(last)],['Nächster Abruf',fmt(next)],['Abfragezeitraum',fmt(query.from)+' – '+fmt(query.to)],['Ereignisse',count??0],['Gerade aktiv',activeCount??0],['Geplante Trigger',tc??0],['API-Version',version||'—']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}
function fill(id,values,placeholder){const el=$(id),old=el.value;el.innerHTML=`<option value="">${placeholder}</option>`+[...new Set(values.filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">${esc(label(v))}</option>`).join('');el.value=old}function renderFilters(){fill('eventType',events.map(e=>e.event_type),'Alle Terminarten');fill('custom',events.map(e=>e.custom_type_label),'Alle eigenen Typen');fill('child',Object.keys(children),'Alle Kinder')}
function render(){const q=$('search').value.toLowerCase(),today=new Date();today.setHours(0,0,0,0);const list=events.filter(e=>(!q||JSON.stringify(e).toLowerCase().includes(q))&&(!$('eventType').value||e.event_type===$('eventType').value)&&(!$('custom').value||e.custom_type_label===$('custom').value)&&(!$('child').value||String(e.child_id)===$('child').value)&&($('range').value==='all'||($('range').value==='future'?new Date(e.ends_at)>=today:new Date(e.starts_at)<new Date(+today+86400000)&&new Date(e.ends_at)>today)));$('rows').innerHTML=list.map(e=>{const ts=triggers.filter(t=>String(t.eventId)===String(e.id));return `<tr><td>${esc(e.title||'—')}</td><td><span class="pill">${esc(label(e.event_type))}</span></td><td>${esc(e.custom_type_label||'—')}</td><td>${esc(children[e.child_id]||e.child_id||'—')}</td><td>${fmt(e.starts_at)}</td><td>${fmt(e.ends_at)}</td><td>${e.all_day?'Ja':'Nein'}</td><td>${ts.length?ts.map(t=>`${esc(t.ruleId)}: ${fmt(t.scheduledFor)}${t.triggered?' ✓':''}`).join('<br>'):'—'}</td></tr>`}).join('');$('empty').hidden=list.length>0}
function refreshing(busy){const button=$('refresh');button.disabled=busy;button.textContent=busy?'Wird aktualisiert …':'Jetzt aktualisieren'}
['search','eventType','custom','child','range'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('range').value='future';$('refresh').onclick=()=>{refreshing(true);socket.emit('setState',instance+'.control.refresh',{val:true,ack:false});setTimeout(()=>refreshing(false),60000)};socket.on('stateChange',(id,state)=>{if(id===instance+'.control.refresh'&&state?.ack&&state.val===false)refreshing(false);if(id.startsWith(instance+'.'))setTimeout(load,250)});socket.emit('subscribeStates',instance+'.*');load()})();</script></body></html>
