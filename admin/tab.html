<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="../../socket.io/socket.io.js"></script>
<style>:root{font-family:system-ui,sans-serif;color:#182033;background:#f4f6fa}body{margin:0}.wrap{max-width:1500px;margin:auto;padding:16px}.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.head img{width:46px}.head h1{margin:0;flex:1}.btn{border:0;border-radius:8px;background:#4f6bed;color:#fff;padding:11px 16px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:16px 0}.card,.filters,.table{background:#fff;border-radius:12px;box-shadow:0 2px 9px #17213b12;padding:14px}.label{font-size:12px;color:#667085}.value{font-size:18px;margin-top:5px;overflow-wrap:anywhere}.filters{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px;margin-bottom:12px}input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccd2df;border-radius:7px;background:white}.table{overflow:auto;padding:0}table{border-collapse:collapse;width:100%;min-width:1100px}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f5;font-size:14px}th{position:sticky;top:0;background:#f8f9fc}.pill{padding:3px 7px;border-radius:10px;background:#e8edff}.ok{color:#14804a}.bad{color:#c4320a}.empty{text-align:center;padding:38px;color:#667085}@media(max-width:800px){.filters{grid-template-columns:1fr 1fr}.filters input:first-child{grid-column:1/-1}.wrap{padding:10px}}.timetables{margin:0 0 16px}.timetables h2{font-size:20px;margin:0 0 10px}.timetable-card{margin-bottom:10px}.timetable-card h3{font-size:17px;margin:0 0 8px}.lesson-meta{color:#667085;font-size:14px;margin:6px 0}.timetable-card summary{cursor:pointer;color:#3654cb;padding:10px 0}.week{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:12px;overflow:auto;padding:8px 0}.day h4{margin:0 0 8px}.lesson{border-left:3px solid var(--subject-color,#4f6bed);background:#f4f6fa;padding:9px;margin-bottom:8px;font-size:14px}.lesson strong,.lesson small{display:block}.lesson.current{background:#e8edff;box-shadow:inset 0 0 0 1px #c5d0fa}.timetable-note{font-size:12px;color:#667085;margin:8px 0 0}@media(max-width:600px){.week{grid-template-columns:1fr;overflow:visible}}</style></head>
<body><main class="wrap"><div class="head"><img src="familienplan.svg" alt=""><h1>FamilienPlan</h1><button class="btn" id="refresh">Jetzt aktualisieren</button></div><section class="cards" id="cards"></section>
<section class="timetables" id="timetables" aria-label="Stundenpläne" hidden></section>
<section class="filters"><input id="search" placeholder="Termine durchsuchen"><select id="eventType"><option value="">Alle Terminarten</option></select><select id="custom"><option value="">Alle eigenen Typen</option></select><select id="child"><option value="">Alle Kinder</option></select><select id="range"><option value="all">Gesamter Zeitraum</option><option value="today">Heute</option><option value="future" selected>Ab heute</option></select></section>
<section class="table"><table><thead><tr><th>Titel</th><th>Terminart</th><th>Eigener Typ</th><th>Kind</th><th>Beginn</th><th>Ende</th><th>Ganztägig</th><th>Trigger</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty" hidden>Keine passenden Termine</div></section></main>
<script>(()=>{const socket=io.connect(),params=new URLSearchParams(location.search),rawInstance=params.get('instance')||params.get('id')||([...params.keys()].find(key=>/^(?:familyplan\.)?\d+$/.test(key))??'0');let instance=/^familyplan\.\d+$/.test(rawInstance)?rawInstance:`familyplan.${/^\d+$/.test(rawInstance)?rawInstance:'0'}`,events=[],children={},triggers=[];const $=id=>document.getElementById(id);const get=(id)=>new Promise(resolve=>socket.emit('getState',instance+'.'+id,(e,s)=>resolve(s?.val)));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>s?new Intl.DateTimeFormat(document.documentElement.lang||'de-DE',{dateStyle:'short',timeStyle:'short'}).format(new Date(s)):'—';const labels={stay:'Aufenthalt / Betreuung',birthday:'Geburtstag',school_holiday:'Schulferien',general:'Allgemein',other:'Sonstige',cleaning:'Reinigung',waste:'Abfall',school:'Schule',private:'Privat'};const label=v=>labels[String(v??'').trim().toLowerCase()]||String(v??'');
async function load(){const vals=await Promise.all(['info.connection','info.lastSuccessfulSync','info.nextSync','info.queryRange','info.eventCount','calendar.current.count','info.scheduledTriggerCount','info.apiVersion','calendar.displayJson','triggers.schedule'].map(get));const [connected,last,next,range,count,activeCount,tc,version,json,schedule]=vals;try{events=JSON.parse(json||'[]')}catch{events=[]}try{triggers=JSON.parse(schedule||'[]')}catch{triggers=[]}children={};events.forEach(event=>{if(event.child_id!=null&&event.child_name)children[event.child_id]=event.child_name});renderFilters();render();let query={};try{query=JSON.parse(range||'{}')}catch{};$('cards').innerHTML=[['Verbindung',connected?'<span class="ok">● Verbunden</span>':'<span class="bad">● Getrennt</span>'],['Letzter Abruf',fmt(last)],['Nächster Abruf',fmt(next)],['Abfragezeitraum',fmt(query.from)+' – '+fmt(query.to)],['Ereignisse',count??0],['Gerade aktiv',activeCount??0],['Geplante Trigger',tc??0],['API-Version',version||'—']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('')}
function fill(id,values,placeholder){const el=$(id),old=el.value;el.innerHTML=`<option value="">${placeholder}</option>`+[...new Set(values.filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">${esc(label(v))}</option>`).join('');el.value=old}function renderFilters(){fill('eventType',events.map(e=>e.event_type),'Alle Terminarten');fill('custom',events.map(e=>e.custom_type_label),'Alle eigenen Typen');fill('child',Object.keys(children),'Alle Kinder')}
function render(){const q=$('search').value.toLowerCase(),today=new Date();today.setHours(0,0,0,0);const list=events.filter(e=>(!q||JSON.stringify(e).toLowerCase().includes(q))&&(!$('eventType').value||e.event_type===$('eventType').value)&&(!$('custom').value||e.custom_type_label===$('custom').value)&&(!$('child').value||String(e.child_id)===$('child').value)&&($('range').value==='all'||($('range').value==='future'?new Date(e.ends_at)>=today:new Date(e.starts_at)<new Date(+today+86400000)&&new Date(e.ends_at)>today)));$('rows').innerHTML=list.map(e=>{const ts=triggers.filter(t=>String(t.eventId)===String(e.id));return `<tr><td>${esc(e.title||'—')}</td><td><span class="pill">${esc(label(e.event_type))}</span></td><td>${esc(e.custom_type_label||'—')}</td><td>${esc(children[e.child_id]||e.child_id||'—')}</td><td>${fmt(e.starts_at)}</td><td>${fmt(e.ends_at)}</td><td>${e.all_day?'Ja':'Nein'}</td><td>${ts.length?ts.map(t=>`${esc(t.ruleId)}: ${fmt(t.scheduledFor)}${t.triggered?' ✓':''}`).join('<br>'):'—'}</td></tr>`}).join('');$('empty').hidden=list.length>0}
const openTimetables=new Set();
let timetableLoading=false,timetableReload=false;
const statusLabels={break:'hat jetzt Pause',before_school:'hat noch keinen Unterricht',finished:'hat für heute Unterrichtsschluss',no_school:'hat heute schulfrei',not_configured:'hat noch keinen Stundenplan',outside_validity:'hat keinen für heute gültigen Stundenplan'};
function lessonColor(lesson){
  if(typeof lesson.color==='string'&&/^#[0-9a-f]{6}$/i.test(lesson.color))return lesson.color;
  const subject=String(lesson.subject||'').trim().toLocaleLowerCase('de-DE').replace(/\s+/g,' ');
  const colors={'mathe':'#3b82c4','mathematik':'#3b82c4','deutsch':'#d97706','deusch':'#d97706','englisch':'#22c55e','sachunterricht':'#65c80f','musik':'#ef4444','kunst':'#eab308','sport':'#7db8ff','schwimmen':'#7db8ff','religion / ethik':'#a020f0','religion':'#a020f0','ethik':'#a020f0','morgenkreis':'#a020f0','lz + daz':'#eab308'};
  if(colors[subject])return colors[subject];
  let hash=0;for(const char of subject)hash=(hash*31+char.charCodeAt(0))>>>0;
  return `hsl(${hash%360} 65% 45%)`;
}
function lessonTime(lesson){return `${esc(lesson.start)}–${esc(lesson.end)} Uhr`}
async function loadTimetables(){
  if(timetableLoading){timetableReload=true;return}
  timetableLoading=true;
  try{
    const states=await new Promise((resolve,reject)=>socket.emit('getStates',instance+'.children.*',(error,result)=>error?reject(error):resolve(result||{})));
    const roots=[...new Set(Object.keys(states).filter(id=>/\.timetable\.[^.]+$/.test(id)).map(id=>id.slice(0,id.lastIndexOf('.'))))].sort();
    const cards=roots.map(root=>{
      const value=key=>states[root+'.'+key]?.val;
      let data;try{data=JSON.parse(value('json')||'null')}catch{}
      const name=data?.childName||states[root.slice(0,-10)+'.name']?.val||root.split('.').at(-2);
      const available=value('available')===true&&data;
      const current=available&&data.status==='lesson'?data.currentLesson:null;
      const next=available?data.nextLesson:null;
      const title=!available?`${esc(name)} · Stundenplan derzeit nicht verfügbar`:current?`${esc(name)} hat jetzt ${esc(current.subject)}${current.teacher?' bei '+esc(current.teacher):''}`:`${esc(name)} ${esc(statusLabels[data.status]||data.statusText)}`;
      const meta=current?`${lessonTime(current)}${current.room?' · Raum '+esc(current.room):''}`:'';
      const nextText=next?`Als Nächstes: ${esc(next.subject)} · ${lessonTime(next)}${next.teacher?' · '+esc(next.teacher):''}${next.room?' · Raum '+esc(next.room):''}`:'';
      const lessons=Array.isArray(data?.weeklySchedule)?data.weeklySchedule:[];
      const days=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
      const week=days.map((day,index)=>{
        const entries=lessons.filter(lesson=>lesson.weekday===index).sort((a,b)=>a.start.localeCompare(b.start));
        if(index>4&&!entries.length)return '';
        return `<div class="day"><h4>${day}</h4>${entries.map(lesson=>{
          const active=current&&data.date===data.statusDate&&current.weekday===index&&current.start===lesson.start&&current.end===lesson.end&&current.subject===lesson.subject;
          return `<div class="lesson${active?' current':''}" style="--subject-color:${lessonColor(lesson)}"><small>${lessonTime(lesson)}${active?' · Aktuell':''}</small><strong>${esc(lesson.subject)}</strong>${lesson.teacher?`<span>${esc(lesson.teacher)}</span>`:''}${lesson.room?`<small>Raum ${esc(lesson.room)}</small>`:''}</div>`;
        }).join('')||'<p class="lesson-meta">Kein Unterricht</p>'}</div>`;
      }).join('');
      return `<article class="card timetable-card"><h3>${title}</h3>${meta?`<p class="lesson-meta">${meta}</p>`:''}${nextText?`<p class="lesson-meta">${nextText}</p>`:''}${!available?`<p class="bad">${esc(value('lastError')||'Noch keine aktuellen Daten vorhanden.')}</p>`:''}${data?`<details data-root="${esc(root)}"${openTimetables.has(root)?' open':''}><summary>Wochenstundenplan anzeigen${available?'':' (letzter bekannter Stand)'}</summary>${lessons.length?`<div class="week">${week}</div>`:'<p class="lesson-meta">Kein Wochenstundenplan hinterlegt.</p>'}</details><p class="timetable-note">Planmäßiger Unterricht · ${esc(data.timezone)} · Stand: ${esc(fmt(value('lastSuccessfulUpdate')))}</p>`:''}</article>`;
    });
    $('timetables').hidden=!cards.length;
    $('timetables').innerHTML=cards.length?'<h2>Stundenplan</h2>'+cards.join(''):'';
    $('timetables').querySelectorAll('details').forEach(details=>details.addEventListener('toggle',()=>{if(details.open)openTimetables.add(details.dataset.root);else openTimetables.delete(details.dataset.root)}));
  }catch{
    $('timetables').hidden=false;
    $('timetables').innerHTML='<div class="card bad">Stundenpläne konnten nicht geladen werden.</div>';
  }finally{timetableLoading=false;if(timetableReload){timetableReload=false;void loadTimetables()}}
}
let loadTimer,timetableTimer;
function refreshing(busy){const button=$('refresh');button.disabled=busy;button.textContent=busy?'Wird aktualisiert …':'Jetzt aktualisieren'}
['search','eventType','custom','child','range'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('range').value='future';$('refresh').onclick=()=>{refreshing(true);socket.emit('setState',instance+'.control.refresh',{val:true,ack:false});setTimeout(()=>refreshing(false),60000)};socket.on('stateChange',(id,state)=>{if(id===instance+'.control.refresh'&&state?.ack&&state.val===false)refreshing(false);if(id.startsWith(instance+'.children.')){clearTimeout(timetableTimer);timetableTimer=setTimeout(loadTimetables,250)}if(id.startsWith(instance+'.')&&!id.includes('.timetable.')){clearTimeout(loadTimer);loadTimer=setTimeout(load,250)}});socket.on('connect',()=>{socket.emit('subscribeStates',instance+'.*');load();loadTimetables()});socket.emit('subscribeStates',instance+'.*');load();loadTimetables()})();</script></body></html>
